name: Android Build & Sign APK

on:
  # מחקנו את ה-push כדי שלא ירוץ כשאתה מאשר את הקוד
  pull_request:
    branches: [ "master", "main" ]
  
  # מאפשר לך להריץ את הבנייה ידנית בלחיצת כפתור (אופציונלי אך מומלץ)
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout the code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Release APK
      run: ./gradlew assembleRelease

    - name: Check the framework stubs are not packaged
      run: |
        # :framework-stubs declares classes this app does not own, under the framework's own
        # package names, so that app code can name them at compile time. It is compileOnly for a
        # reason: a packaged copy is a class the shrinker may rename or merge, and then the app
        # asks the real framework class for a member only the copy ever had - which is how
        # Class.forName on IDevicePolicyManager$Stub once died with NoSuchFieldError on a field
        # called "a". Whether the module is on the runtime classpath is what decides whether it
        # is dexed, so Gradle is asked that directly rather than the APK being taken on trust.
        deps="$RUNNER_TEMP/release-runtime-deps.txt"
        ./gradlew -q :app:dependencies --configuration releaseRuntimeClasspath > "$deps"
        # A query that answered nothing would pass the test below for the wrong reason, so what
        # came back has to look like the tree that was asked for before it is read for an absence
        if ! grep -q "releaseRuntimeClasspath" "$deps"; then
          echo "::error::the release runtime classpath could not be read, so nothing was checked"
          cat "$deps"
          exit 1
        fi
        if grep -q "framework-stubs" "$deps"; then
          echo "::error::framework-stubs is on the release runtime classpath, so it reaches the APK. It has to stay compileOnly."
          exit 1
        fi
        echo "Read $(wc -l < "$deps") lines of release runtime classpath; framework-stubs is not among them"

    - name: Sign APK
      uses: r0adkll/sign-android-release@v1
      id: sign_app
      with:
        releaseDirectory: app/build/outputs/apk/release
        signingKeyBase64: ${{ secrets.KEYSTORE_FILE }}
        alias: ${{ secrets.KEY_ALIAS }}
        keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
        keyPassword: ${{ secrets.KEY_PASSWORD }}
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk
        BUILD_TOOLS_VERSION: "34.0.0"

    - name: Upload Signed APK
      uses: actions/upload-artifact@v4
      with:
        # השם הייחודי מונע שגיאת 409
        name: app-release-signed-${{ github.run_number }}
        path: ${{ steps.sign_app.outputs.signedReleaseFile }}
        overwrite: true
