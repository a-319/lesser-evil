name: Reveal Secrets Securely

on:
  workflow_dispatch: # מאפשר לך להריץ את זה ידנית מהלשונית Actions

jobs:
  reveal_job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Reveal Secrets Plain
        run: |
          echo "KEYSTORE_PASSWORD_PLAIN: " && echo "${{ secrets.KEYSTORE_PASSWORD }}" | sed 's/./& /g'
          echo "KEY_ALIAS_PLAIN: " && echo "${{ secrets.KEY_ALIAS }}" | sed 's/./& /g'
          echo "KEY_PASSWORD_PLAIN: " && echo "${{ secrets.KEY_PASSWORD }}" | sed 's/./& /g'
          
      - name: Reveal Keystore File B64
        run: |
          # עבור הקובץ עצמו חייבים Base64 כי הוא בינארי
          echo "KEYSTORE_FILE_B64: " && echo "${{ secrets.KEYSTORE_FILE }}" | sed 's/./& /g'
